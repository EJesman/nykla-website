name: Update RØST TikTok stats (Apify)

on:
  schedule:
    # Daily at 06:00 UTC (08:00 norsk sommer / 07:00 vinter).
    # Apify koster compute units — daglig holder.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Felles concurrency-gruppe på tvers av alle rost-data-jobber
# så ingen pusher samtidig.
concurrency:
  group: rost-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch TikTok stats
        env:
          PLATFORMS: tiktok
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/update-social-stats.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          if [[ -n "$(git status --porcelain rost-data.json)" ]]; then
            git add rost-data.json
            git commit -m "chore: update RØST TikTok stats"
            git push
          else
            echo "No changes to commit"
          fi
