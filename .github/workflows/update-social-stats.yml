name: Update RØST social stats

on:
  schedule:
    # Daily at 06:00 UTC (08:00 norsk sommer / 07:00 vinter).
    # Apify-scraping er dyrere enn YouTube API — daglig holder.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-social
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch social stats (Meta API + Apify TikTok)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/update-social-stats.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain rost-data.json)" ]]; then
            git add rost-data.json
            git commit -m "chore: update RØST social stats"
            git push
          else
            echo "No changes to commit"
          fi
