name: Update RØST Meta stats (Instagram + Facebook)

on:
  schedule:
    # Hvert 15. minutt. Meta Graph API er gratis så hyppige kall
    # koster ingenting — view-tall blir tilnærmet real-time.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Felles concurrency-gruppe på tvers av alle rost-data-jobber
# så ingen pusher samtidig.
concurrency:
  group: rost-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with latest origin before running
        run: git pull --rebase

      - name: Fetch Instagram + Facebook stats
        env:
          PLATFORMS: instagram,facebook
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
        run: node scripts/update-social-stats.mjs

      - name: Verify JSON integrity before push
        run: |
          node -e "const d = JSON.parse(require('fs').readFileSync('rost-data.json','utf8')); if (!d.stats || !d.videos) { console.error('rost-data.json missing stats/videos — aborting'); process.exit(1); }"

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain rost-data.json)" ]]; then
            git add rost-data.json
            git commit -m "chore: update RØST Meta stats"
            git push || echo "Push failed — another workflow pushed first. Next cron will retry."
          else
            echo "No changes to commit"
          fi
